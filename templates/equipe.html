<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <title>Equipe Fiscal - Klygen</title>

    <link

      href="{{ url_for('static', filename='css/style.css') }}"

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link

  <body>

          <polygon points="35,27 124,27 200,103 124,103 85,65" fill="#1769E8" />

          <polygon points="35,27 85,70 85,137 35,180" fill="#16D6C8" />

      <nav>
        <ul>
          <li>
            <a href="/">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"

              >
                <rect x="3" y="4" width="18" height="17" rx="2" />
                <path d="M8 2v4M16 2v4M3 10h18M8 14h3M8 17h6" />

          </li>

              <svg

                <path
                  d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"

                <rect x="5" y="2" width="14" height="20" rx="2" />
                <path d="M8 6h8v4H8zM8 14h2M14 14h2M8 18h2M14 18h2" />

      <section id="lista-equipe" class="equipe-lista"></section>
