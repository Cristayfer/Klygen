<div class="modal-overlay" id="modal-tarefa">
  <div class="modal-content">
    <div class="task-form-header">
      <div>
        <h1>Novo Chamado</h1>
        <p>Preencha todos os campos para fazer a solicitação</p>
      </div>
      <button id="cancelar" class="btn-cancel">Cancelar</button>
    </div>

    <form id="task-form">
      <div class="form-group">
        <label for="titulo"> Titulo </label>
        <select id="titulo" name="titulo" required>
          <option value="" selected disabled>Selecione uma opção</option>
          <option>Item sem regra</option>
          <option>Item com mais de uma regra</option>
          <option>Item com redução divergente</option>
          <option>Item com pauta/MVA/FCP divergente</option>
          <option>Item com Aliq ICMS/ST/IPI divergente</option>
          <option>Item com inicio/fim vigencia divergente</option>
          <option>Item sem regra de exceção para o fornecedor</option>
        </select>
      </div>
      <div class="form-group">
        <label for="descricao">Descrição</label>

        <textarea
          id="descricao"
          name="descricao"
          rows="6"
          placeholder="Descreva o problema..."
        ></textarea>
      </div>
      <div class="form-group">
        <span class="form-label">Anexo</span>
        <input
          type="file"
          id="anexo"
          name="anexo"
          accept=".png, .jpg, .jpeg, .pdf, .xlsx, .xls"
          multiple
        />

        <label class="file-upload" for="anexo"> Selecionar Arquivo </label>
        <small> Anexe um print ou pdf relacionados </small>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="prioridade"> Prioridade </label>
          <select name="prioridade" id="prioridade" required>
            <option value="" selected disabled>Selecione a Prioridade</option>
            <option value="high">Alta</option>
            <option value="medium">Média</option>
            <option value="low">Baixa</option>
          </select>
        </div>

        <div class="form-group">
          <label for="estado">Estado</label>
          <select name="estado" id="estado" required>
            <option value="" selected disabled>Selecione o Estado</option>
            <option value="MG">Minas Gerais</option>
            <option value="ES">Espirito Santo</option>
            <option value="BA">Bahia</option>
            <option value="PE">Pernambuco</option>
          </select>

        </div>
        <div class="form-group">
          <label for="data"> Data de solicitação </label>
          <input type="text" id="data" name="data" readonly />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-create">Criar Solicitação</button>
        </div>
        
        </div>
      </div>
    </form>
  </div>
</div>
