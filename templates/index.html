<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klygen</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- SIDEBAR -->

    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="logo">
          <svg
            class="logo-icon"
            viewBox="0 0 200 200"
            xmlns="http://www.w3.org/2000/svg"
            aria-label="Klygen"
          >
            <polygon
              points="35,27 124,27 200,103 124,103 85,65"
              fill="#1769E8"
            />
            <polygon points="35,27 85,70 85,137 35,180" fill="#16D6C8" />
            <polygon
              points="35,180 124,180 200,103 124,103 85,137"
              fill="#6930F2"
            />
          </svg>

          <h2>KLYGEN</h2>
        </div>

        <nav>
          <ul>
            <li>
              <a href="/">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <rect x="3" y="4" width="18" height="17" rx="2" />
                  <path d="M8 2v4M16 2v4M3 10h18M8 14h3M8 17h6" />
                </svg>
                <span>Tarefas</span>
              </a>
            </li>

            <li>
              <a href="/solicitacoes">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <path
                    d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                  />
                  <path d="M14 2v6h6M8 13h8M8 17h8" />
                </svg>
                <span>Solicitações</span>
              </a>
            </li>

            <li>
              <a href="/calculadora-fiscal">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <rect x="5" y="2" width="14" height="20" rx="2" />
                  <path d="M8 6h8v4H8zM8 14h2M14 14h2M8 18h2M14 18h2" />
                </svg>
                <span>Calculadora Fiscal</span>
              </a>
            </li>

            <li>
              <a href="/equipe">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <circle cx="9" cy="8" r="3" />
                  <path d="M3 20v-2a6 6 0 0 1 12 0v2H3z" />
                  <path d="M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 4v2h-3" />
                </svg>
                <span>Equipe Fiscal</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <button class="perfil-usuario" id="perfil-usuario" type="button">
          <div class="perfil-avatar" id="perfil-avatar">
            <span id="perfil-iniciais">--</span>
          </div>

          <div class="perfil-info">
            <strong id="perfil-nome">Carregando...</strong>
            <span id="perfil-tipo">Usuário</span>
          </div>
        </button>

        <a href="/logout" class="btn-logout">
          <span class="logout-icon">↪</span>
          <span>Sair</span>
        </a>
      </div>
    </aside>

    <!-- CONTEÚDO -->

    <main>
      <!-- HEADER -->

      <header class="header">
        <div class="header-right">
          <button id="abrir" class="btn-add">+ Nova Tarefa</button>
        </div>
      </header>

      <!-- KANBAN -->

      <section class="board">
        <!-- Pendências -->

        <div class="column" data-status="pending">
          <div class="column-header">
            <div class="column-title">
              <h3>Pendências</h3>

              <span class="task-count danger"></span>
            </div>
          </div>
          <div class="task-list"></div>
        </div>

        <!-- Pronto -->

        <div class="column" data-status="ready">
          <div class="column-header">
            <div class="column-title">
              <h3>Pronto</h3>

              <span class="task-count warning"></span>
            </div>
          </div>

          <div class="task-list"></div>
        </div>

        <!-- Em andamento -->

        <div class="column" data-status="progress">
          <div class="column-header">
            <div class="column-title">
              <h3>Em Andamento</h3>
              <span class="task-count info"></span>
            </div>
          </div>
          <div class="task-list"></div>
        </div>

        <!-- Revisão -->

        <div class="column" data-status="review">
          <div class="column-header">
            <div class="column-title">
              <h3>Revisão</h3>
              <span class="task-count purple"></span>
            </div>
          </div>

          <div class="task-list"></div>
        </div>

        <!-- Concluído -->

        <div class="column" data-status="completed">
          <div class="column-header">
            <div class="column-title">
              <h3>Concluído</h3>
              <span class="task-count success"></span>
            </div>
          </div>

          <div class="task-list"></div>
        </div>
      </section>
      <div id="modal-container"></div>
      <div id="details-modal-container"></div>
    </main>
    <script src="{{ url_for('static', filename='js/perfil.js') }}"></script>
    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
  </body>
</html>
