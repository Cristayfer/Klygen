<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klygen</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- SIDEBAR -->

    <aside class="sidebar">
      <div class="logo">
        <svg
          class="logo-icon"
          viewBox="0 0 200 200"
          xmlns="http://www.w3.org/2000/svg"
          aria-label="Klygen"
        >
          <polygon points="35,27 124,27 200,103 124,103 85,65" fill="#1769E8" />
          <polygon points="35,27 85,70 85,137 35,180" fill="#16D6C8" />
          <polygon
            points="35,180 124,180 200,103 124,103 85,137"
            fill="#6930F2"
          />
        </svg>

        <h2>KLYGEN</h2>
      </div>

      <nav>
        <ul>
          <li><a href="/">Tarefas</a></li>
          <li><a href="equipe">Equipe Fiscal</a></li>
          <li><a href="calculadora.html">Calculadora Fiscal</a></li>
          <li><a href="/solicitacoes">Solicitações</a></li>
          <li><a href="configuracoes">Configurações</a></li>
        </ul>
      </nav>
      <button class="perfil-usuario" id="perfil-usuario" type="button">
        <div class="perfil-avatar" id="perfil-avatar">
          <span id="perfil-iniciais">--</span>
        </div>

        <div class="perfil-info">
          <strong id="perfil-nome">Carregando...</strong>
          <span id="perfil-tipo">Usuário</span>
        </div>
      </button>
    </aside>

    <!-- CONTEÚDO -->

    <main>
      <!-- HEADER -->

      <header class="header">
        <div class="header-right">
          <button id="abrir" class="btn-add">+ Nova Tarefa</button>
        </div>
      </header>

      <!-- KANBAN -->

      <section class="board">
        <!-- Pendências -->

        <div class="column" data-status="pending">
          <div class="column-header">
            <div class="column-title">
              <h3>Pendências</h3>

              <span class="task-count danger"></span>
            </div>
          </div>
          <div class="task-list"></div>
        </div>

        <!-- Pronto -->

        <div class="column" data-status="ready">
          <div class="column-header">
            <div class="column-title">
              <h3>Pronto</h3>

              <span class="task-count warning"></span>
            </div>
          </div>

          <div class="task-list"></div>
        </div>

        <!-- Em andamento -->

        <div class="column" data-status="progress">
          <div class="column-header">
            <div class="column-title">
              <h3>Em Andamento</h3>
              <span class="task-count info"></span>
            </div>
          </div>
          <div class="task-list"></div>
        </div>

        <!-- Revisão -->

        <div class="column" data-status="review">
          <div class="column-header">
            <div class="column-title">
              <h3>Revisão</h3>
              <span class="task-count purple"></span>
            </div>
          </div>

          <div class="task-list"></div>
        </div>

        <!-- Concluído -->

        <div class="column" data-status="completed">
          <div class="column-header">
            <div class="column-title">
              <h3>Concluído</h3>
              <span class="task-count success"></span>
            </div>
          </div>

          <div class="task-list"></div>
        </div>
      </section>
      <div id="modal-container"></div>
      <div id="details-modal-container"></div>
    </main>
    <script src="{{ url_for('static', filename='js/perfil.js') }}"></script>
    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
  </body>
</html>
